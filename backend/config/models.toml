active_profile = "qwen4b"
summary_profile = "qwen9b"

[ollama]
base_url = "http://127.0.0.1:11434"
timeout_seconds = 600

[prompts]
system_file = "config/prompts/analyst_system.md"
notes_file = "config/prompts/notes_system.md"
summary_file = "config/prompts/summary_system.md"

[storage]
notes_dir = "data/notes"
database_file = "data/app.db"
uploads_dir = "data/uploads"

[profiles.qwen4b]
model = "qwen3.5:4b"
num_ctx = 8192
temperature = 0.2
top_p = 0.9
keep_alive = "30m"
chunk_size_chars = 6000
chunk_overlap_chars = 400
summary_batch_chars = 15000
max_output_tokens = 1024
think = false

[profiles.qwen9b]
model = "qwen3.5:9b"
num_ctx = 8192
temperature = 0.2
top_p = 0.9
keep_alive = "30m"
